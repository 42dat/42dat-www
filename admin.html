<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문의 관리 · 42DAT</title>
<style>
  :root{
    --bg:#0b0d12; --card:#12151c; --line:#232733; --text:#f1f2f5; --sub:#9aa1b0; --gold:#c9a25c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  a{color:inherit; text-decoration:none;}

  header{position:sticky; top:0; z-index:20; background:rgba(11,13,18,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
  .nav{max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:16px 20px;}
  .logo{font-weight:800; font-size:18px; letter-spacing:1px;}
  .logo span{color:var(--gold);}
  .back{font-size:13px; font-weight:600; color:var(--sub);}
  .back:hover{color:var(--text);}

  .wrap{max-width:900px; margin:0 auto; padding:60px 20px 100px;}
  .ttl{font-size:24px; font-weight:800; margin:0 0 30px;}

  .gate{max-width:340px; margin:80px auto; text-align:center;}
  .gate input{width:100%; background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--text); font-size:15px; padding:13px 15px; text-align:center; letter-spacing:2px; margin-bottom:12px;}
  .gate button{width:100%; background:var(--gold); color:#1a1408; font-weight:800; font-size:14px; border:none; border-radius:10px; padding:13px; cursor:pointer;}
  .gate .err{color:#e5484d; font-size:12.5px; margin-top:10px; display:none;}

  .row{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:10px; cursor:pointer;}
  .row-head{display:flex; align-items:center; gap:10px;}
  .row-head .type{font-size:11px; font-weight:700; color:var(--gold); border:1px solid var(--gold); border-radius:14px; padding:3px 10px; flex:none;}
  .row-head .title{font-size:14.5px; font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row-head .date{font-size:12px; color:var(--sub); flex:none;}
  .row-meta{font-size:12.5px; color:var(--sub); margin-top:6px;}
  .row-body{display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); font-size:13.5px; line-height:1.7; white-space:pre-wrap;}
  .row.open .row-body{display:block;}
  .empty{text-align:center; color:var(--sub); font-size:13px; padding:60px 0;}
  .cnt{color:var(--sub); font-weight:400; font-size:14px;}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="/">42<span>.</span>DAT</a>
    <a class="back" href="/">‹ 홈으로</a>
  </div>
</header>

<div class="wrap">
  <div class="gate" id="gate">
    <input type="password" id="codeInp" placeholder="관리자 코드" autocomplete="off">
    <button id="gateBtn">확인</button>
    <div class="err" id="gateErr">코드가 올바르지 않아요.</div>
  </div>

  <div id="board" style="display:none;">
    <div class="ttl">📮 문의 목록 <span class="cnt" id="cnt"></span></div>
    <div id="list"></div>
  </div>
</div>

<script>
  const KEY = 'dat42_admin_code';

  function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(ts){ const d = new Date(ts); return d.toLocaleString('ko-KR', {year:'2-digit', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}); }

  async function tryLoad(code){
    const r = await fetch('/api/inquiries?code=' + encodeURIComponent(code));
    const j = await r.json();
    if(!j.ok) return false;
    sessionStorage.setItem(KEY, code);
    render(j.items);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('board').style.display = 'block';
    return true;
  }

  function render(items){
    document.getElementById('cnt').textContent = '(' + items.length + '건)';
    const list = document.getElementById('list');
    if(!items.length){ list.innerHTML = '<div class="empty">아직 접수된 문의가 없어요.</div>'; return; }
    list.innerHTML = items.map((it, i) => `
      <div class="row" data-i="${i}">
        <div class="row-head">
          <span class="type">${esc(it.type)}</span>
          <span class="title">${esc(it.title)}</span>
          <span class="date">${fmtDate(it.ts)}</span>
        </div>
        <div class="row-meta">${esc(it.name)} · ${esc(it.phone || '-')} · ${esc(it.email)}</div>
        <div class="row-body">${esc(it.body)}</div>
      </div>
    `).join('');
    document.querySelectorAll('.row').forEach(r => r.onclick = () => r.classList.toggle('open'));
  }

  document.getElementById('gateBtn').onclick = async () => {
    const code = document.getElementById('codeInp').value.trim();
    if(!code) return;
    const ok = await tryLoad(code);
    if(!ok) document.getElementById('gateErr').style.display = 'block';
  };
  document.getElementById('codeInp').onkeydown = e => { if(e.key === 'Enter') document.getElementById('gateBtn').click(); };

  const saved = sessionStorage.getItem(KEY);
  if(saved) tryLoad(saved);
</script>

</body>
</html>
