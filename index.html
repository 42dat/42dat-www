<title>42DAT</title>
<style>
  :root{
    --bg:#0b0d12; --card:#12151c; --line:#232733; --text:#f1f2f5; --sub:#9aa1b0; --gold:#c9a25c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  a{color:inherit; text-decoration:none;}

  header{position:sticky; top:0; z-index:20; background:rgba(11,13,18,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
  .nav{max-width:1080px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:16px 20px;}
  .logo{font-weight:800; font-size:18px; letter-spacing:1px;}
  .logo span{color:var(--gold);}
  .hero{max-width:1080px; margin:0 auto; padding:90px 20px 20px; text-align:center;}
  .hero .kicker{font-size:12px; letter-spacing:3px; color:var(--gold); font-weight:700; margin-bottom:14px;}
  .hero h1{font-size:38px; font-weight:800; margin:0 0 14px; letter-spacing:-.5px;}
  .hero p{color:var(--sub); font-size:15px; max-width:520px; margin:0 auto;}

  .maintiles{max-width:1080px; margin:0 auto; padding:50px 20px 80px; display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
  @media (max-width:820px){ .maintiles{gap:12px;} }
  @media (max-width:480px){ .maintiles{gap:8px; padding:36px 12px 60px;} }
  .maintile{aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:22px; cursor:pointer; transition:transform .15s ease, border-color .15s ease, background .15s ease;}
  .maintile:hover{transform:translateY(-4px); border-color:var(--gold); background:#171b24;}
  .maintile .ico{font-size:36px;}
  .maintile b{font-size:16px; font-weight:800;}
  @media (max-width:480px){ .maintile{border-radius:14px; gap:6px;} .maintile .ico{font-size:24px;} .maintile b{font-size:11.5px;} }

</style>
</head>

  </div>

</html>
