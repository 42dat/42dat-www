<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스트리머 매니저 · 42DAT</title>
<style>
  :root{
    --bg:#0b0d12; --card:#12151c; --line:#232733; --text:#f1f2f5; --sub:#9aa1b0; --gold:#c9a25c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  a{color:inherit; text-decoration:none;}

  header{position:sticky; top:0; z-index:20; background:rgba(11,13,18,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
  .nav{max-width:1080px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:16px 20px;}
  .logo{font-weight:800; font-size:18px; letter-spacing:1px;}
  .logo span{color:var(--gold);}
  .back{font-size:13px; font-weight:600; color:var(--sub);}
  .back:hover{color:var(--text);}

  .wrap{max-width:640px; margin:0 auto; padding:90px 20px 100px; text-align:center;}
  .ico{font-size:56px; display:block; margin-bottom:22px;}
  h1{font-size:28px; font-weight:800; margin:0 0 10px;}
  .desc{color:var(--sub); font-size:14.5px; line-height:1.6; margin:0 0 28px;}
  .soon{display:inline-block; font-size:12px; font-weight:700; color:var(--gold); border:1px solid var(--gold); border-radius:20px; padding:5px 16px; margin-bottom:34px;}
  .box{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; text-align:left; font-size:13.5px; color:var(--sub); line-height:1.7;}
  .box b{display:block; color:var(--text); font-size:14px; margin-bottom:6px;}

  footer{border-top:1px solid var(--line); padding:30px 20px; text-align:center; color:var(--sub); font-size:12px; margin-top:60px;}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="/">42<span>.</span>DAT</a>
    <a class="back" href="/#program">‹ 목록으로</a>
  </div>
</header>

<div class="wrap">
  <span class="ico">📡</span>
  <h1>스트리머 매니저</h1>
  <div class="desc">치지직 · SOOP 방송 관리 도구</div>
  <div class="soon">준비중</div>
  <div class="box"><b>출시 안내</b>현재 개발 중인 도구입니다. 출시되면 이 페이지에서 다운로드·자세한 소개를 확인하실 수 있어요.</div>
</div>

<footer>© 2026 42DAT. All rights reserved.</footer>

</body>
</html>
